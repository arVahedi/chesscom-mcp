name: chess-com-mcp

services:
  chess-com-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess-com-mcp:local
    environment:
      CHESS_COM_MCP_BIND_HOST: "0.0.0.0"
      CHESS_COM_MCP_PORT: "8765"
      CHESS_COM_MCP_AUTH_TOKENS: "${CHESS_COM_MCP_AUTH_TOKENS:?set CHESS_COM_MCP_AUTH_TOKENS to a nonempty JSON token map}"
      CHESS_COM_MCP_ALLOWED_HOSTS: "127.0.0.1:8765,localhost:8765"
      CHESS_COM_MCP_LOG_LEVEL: "WARNING"
    ports:
      - "8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure:5
